<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cotton On – Ventas</title>

<style>
  body {
    font-family: -apple-system, Arial;
    margin: 0;
    background: #f4f4f4;
    padding: 20px;
  }

  .section {
    width: 100%;
    display: flex;
    justify-content: center;
    margin-bottom: 40px;
  }

  /* HERO */
  .hero-img {
    position: relative;
    width: 100%;
    max-width: 1200px;
    overflow: hidden;
    border-radius: 22px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
  }

  .hero-img img {
    width: 100%;
    display: block;
    filter: brightness(70%);
  }

  .hero-overlay {
    position: absolute;
    bottom: 25px;
    left: 25px;
    right: 25px;
    color: white;
    text-shadow: 0 4px 12px rgba(0,0,0,0.6);
  }

  .hero-logo { width: 150px; margin-bottom: 15px; }
  .hero-overlay h1 { font-size: 34px; margin: 0; }
  .hero-overlay p { font-size: 20px; margin: 6px 0 0; }

  /* CUADRO BLANCO */
  .container {
    background: white;
    width: 90%;
    max-width: 420px;
    padding: 32px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 22px rgba(0,0,0,0.12);
  }

  h2 {
    font-size: 26px;
    margin-bottom: 25px;
  }

  /* BOTONES CENTRADOS */
  .btn {
    display: block;
    width: 100%;
    max-width: 300px;  /* LIMITE PARA QUE NO HAGA SALTO RARO */
    margin: 0 auto 16px auto;  /* ⭐ CENTRA LOS BOTONES */
    background: #E4002B;
    color: white;
    text-decoration: none;
    padding: 16px;
    font-size: 18px;
    border-radius: 12px;
    font-weight: bold;
  }

  .black { background: black; }

  @media(max-width:600px){
    .hero-overlay h1 { font-size: 22px; }
    .hero-logo { width: 110px; }
    .hero-overlay p { font-size: 14px; }
  }
</style>

</head>
<body>

<!-- HERO -->
<div class="section">
  <div class="hero-img">
    <img src="https://i.imgur.com/vfanebX.jpeg">
    <div class="hero-overlay">
      <img class="hero-logo" src="https://i.imgur.com/64IZNIF.png">
      <h1>Cotton On – Ventas del Día</h1>
      <p>Gestiona y revisa tus ventas en tiempo real.</p>
    </div>
  </div>
</div>

<!-- PANEL DE MENÚ -->
<div class="section">
  <div class="container">
    <h2>Cotton On – Ventas</h2>

    <a class="btn" href="ingreso.html">Actualizar Ventas</a>
    <a class="btn black" href="ranking.html">Ver Ranking en Vivo</a>
  </div>
</div>

</body>
</html>
